# Kaze — preferencias de bajo consumo de RAM y velocidad.
# Formato: el mismo que usa Zen en prefs/ (lo procesa tools/ffprefs al compilar).
# Cada valor aquí sobrescribe el que traen Firefox y Zen.

# ── Pestañas: descargar las que no usas ─────────────────────────────

# Descargar pestañas automáticamente cuando el sistema se queda sin memoria.
- name: browser.tabs.unloadOnLowMemory
  value: true

# Una pestaña tiene que llevar al menos 5 min sin usarse para poder descargarse.
- name: browser.tabs.min_inactive_duration_before_unload
  value: 300000

# Windows: empezar a descargar pestañas cuando queden menos de 1 GB de memoria comprometible
# (Firefox espera hasta 200 MB por defecto, que ya es tarde).
- name: browser.low_commit_space_threshold_mb
  condition: "defined(XP_WIN)"
  value: 1024

# ── Procesos ────────────────────────────────────────────────────────

# Menos procesos de contenido compartidos (Firefox usa 8).
- name: dom.ipc.processCount
  value: 4

# Con aislamiento por sitio (Fission), 1 proceso por sitio en vez de 4.
# Sigue aislando sitios entre sí; solo evita duplicar procesos del mismo sitio.
- name: dom.ipc.processCount.webIsolated
  value: 1

# Mantener un proceso precargado listo para abrir pestañas rápido.
- name: dom.ipc.processPrelaunch.enabled
  value: true

# ── Cachés en memoria ───────────────────────────────────────────────

# Páginas que se guardan completas en RAM para el botón "atrás" (por defecto hasta 8).
- name: browser.sessionhistory.max_total_viewers
  value: 2

# Caché de red en RAM: 64 MB máximo (-1 = automático, puede crecer mucho más).
- name: browser.cache.memory.capacity
  value: 65536

# Guardar la sesión cada 60 s en vez de cada 15 s (menos escrituras y CPU).
- name: browser.sessionstore.interval
  value: 60000

# ── Velocidad de carga ──────────────────────────────────────────────

- name: network.http.max-persistent-connections-per-server
  value: 10

- name: network.dns.disablePrefetchFromHTTPS
  value: false

- name: content.notify.interval
  value: 100000
