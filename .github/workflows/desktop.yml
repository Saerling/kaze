name: Escritorio

on:
  push:
    branches: [main]
    paths: ["desktop/**", "branding/**", ".github/workflows/desktop.yml"]
  pull_request:
    paths: ["desktop/**", "branding/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:

permissions:
  contents: write # para publicar cada versión de Windows en Releases (de ahí se actualiza Kaze)

jobs:
  check:
    name: Parches, sintaxis y marca
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Comprobar contra la versión de Firefox de surfer.json
        run: python3 desktop/scripts/check.py

  windows:
    name: Instalador de Windows
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Número de versión
        # Cada versión tiene un número mayor: Kaze lo compara para saber si hay una nueva.
        run: echo "KAZE_BUILD=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Herramientas (7-Zip y NSIS)
        run: sudo apt-get update -q && sudo apt-get install -y -q p7zip-full nsis

      - name: Descargar Firefox para Windows (español)
        run: |
          FX=$(python3 -c "import json;print(json.load(open('desktop/surfer.json'))['version']['version'])")
          echo "FIREFOX=$FX" >> "$GITHUB_ENV"
          curl -fsSL --retry 5 -o firefox-setup.exe \
            "https://archive.mozilla.org/pub/firefox/releases/$FX/win64/es-MX/Firefox%20Setup%20$FX.exe"
          ls -la firefox-setup.exe

      - name: Herramienta para el ícono del .exe
        run: npm ci --prefix desktop/scripts

      - name: Armar Zev e instalador
        run: python3 desktop/scripts/empaquetar_windows.py --setup firefox-setup.exe --build "$KAZE_BUILD" --salida dist

      - name: Subir instalador
        uses: actions/upload-artifact@v7
        with:
          name: zev-windows
          path: dist/Zev-*-setup.exe

      - name: Publicar versión (Zev la detecta y se actualiza)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Descarga **Zev-0.4.$KAZE_BUILD-setup.exe**, ábrelo y listo: se instala sin permisos de administrador."
            echo "Si ya tienes Zev (antes Kaze), se actualiza encima sin perder nada y te avisa solo de las nuevas versiones."
            echo
            echo "Basado en Firefox $FIREFOX."
            echo
            echo "Cambios:"
            git log -1 --pretty=format:'%s%n%n%b' | sed '/^Co-Authored-By/d;/^Claude-Session/d'
          } > notes.md
          gh release create "windows-$KAZE_BUILD" dist/Zev-*-setup.exe \
            --title "Zev Windows 0.4.$KAZE_BUILD" \
            --notes-file notes.md \
            --target "$GITHUB_SHA"
