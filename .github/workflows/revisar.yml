name: Revisar Android

# Revisor (lint), verificador (pruebas y capturas) y emulador (Fyx corriendo en un Android real).
on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/revisar.yml"]
  pull_request:
    paths: ["android/**"]
  workflow_dispatch:

jobs:
  revisor:
    name: Revisor (lint)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: android } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew lintDebug
      - if: always()
        uses: actions/upload-artifact@v7
        with: { name: revisor-lint, path: android/app/build/reports/lint-results-debug.* }

  verificador:
    name: Verificador (pruebas y capturas)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: android } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew testDebugUnitTest
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verificador-capturas
          path: |
            docs/capturas/*.png
            android/app/build/reports/tests/

  emulador:
    name: Emulador (Android 14)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults: { run: { working-directory: android } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
      - name: Activar KVM
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - run: ./gradlew assembleDebug
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          working-directory: android
          disable-animations: false
          script: ./scripts/emulador.sh
      - if: always()
        uses: actions/upload-artifact@v7
        with: { name: emulador, path: android/emulador/ }
