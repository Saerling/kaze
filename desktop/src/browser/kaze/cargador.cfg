// Kaze — cargador (autoconfig de Firefox). La primera línea debe ser un comentario.
// Registra chrome://kaze/ y pone la interfaz de Kaze en cada ventana del navegador.
// Lo usan el instalador de Windows (KAZE_DIR vacío: carpeta "kaze" junto a firefox.exe)
// y el cargador de desarrollo (desktop/dev/instalar.py, que pone la ruta del repo).
try {
  const KAZE_DIR = "@KAZE_DIR@";
  const DEV = KAZE_DIR && !KAZE_DIR.startsWith("@");
  // En el instalador de Windows, firefox.exe sin "-app" es Firefox (con el perfil de Firefox):
  // ahí Kaze no se carga, para no tocar ese perfil.
  if (!DEV && Services.appinfo.name != "Kaze") throw new Error("[Kaze] no es Kaze: no se carga");
  const dir = Cc["@mozilla.org/file/local;1"].createInstance(Ci.nsIFile);
  if (DEV) {
    dir.initWithPath(KAZE_DIR);
  } else {
    dir.initWithFile(Services.dirsvc.get("GreD", Ci.nsIFile));
    dir.append("kaze");
  }
  const manifest = dir.clone();
  manifest.append("kaze.manifest");
  Components.manager.QueryInterface(Ci.nsIComponentRegistrar).autoRegister(manifest);

  const inject = win => {
    if (win.location.href != "chrome://browser/content/browser.xhtml") return;
    win.windowUtils.loadSheetUsingURIString("chrome://kaze/content/kaze.css", win.windowUtils.AUTHOR_SHEET);
    Services.scriptloader.loadSubScript("chrome://kaze/content/kaze.js", win);
  };
  Services.obs.addObserver(win => inject(win), "browser-delayed-startup-finished");
} catch (e) {
  if (!String(e).includes("no es Kaze")) Cu.reportError(e);
}
