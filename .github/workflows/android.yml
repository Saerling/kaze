name: Android

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  apk:
    name: Compilar APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v4

      - name: Instalar Android 17 QPR2 (API 37.2)
        run: sdkmanager "platforms;android-37.2"

      - uses: gradle/actions/setup-gradle@v6

      - name: Compilar
        run: ./gradlew assembleRelease --console=plain

      - name: Subir APK (ARM 64 bits, la mayoría de celulares)
        uses: actions/upload-artifact@v7
        with:
          name: kaze-arm64-v8a
          path: android/app/build/outputs/apk/release/app-arm64-v8a-release.apk

      - name: Subir APK (ARM 32 bits, celulares viejos)
        uses: actions/upload-artifact@v7
        with:
          name: kaze-armeabi-v7a
          path: android/app/build/outputs/apk/release/app-armeabi-v7a-release.apk
