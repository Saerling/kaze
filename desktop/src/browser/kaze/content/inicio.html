<html lang="es">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src chrome:; img-src chrome: page-icon: moz-icon: data: blob:; style-src chrome: 'unsafe-inline'; object-src 'none'">
  <meta name="color-scheme" content="light dark">
  <title>Página de inicio</title>
  <link rel="icon" href="chrome://kaze/content/iconos/kaze.svg">
  <link rel="stylesheet" href="chrome://kaze/content/inicio.css">
  <script src="chrome://kaze/content/inicio.js" defer></script>
</head>
<body>
  <main>
    <header id="saludo">
      <p id="fecha"></p>
      <h1 id="hola">Hola</h1>
    </header>
    <button id="buscar" type="button">
      <span class="lupa"></span>
      <span>Buscar o escribir una dirección</span>
    </button>

    <section id="favoritos" hidden>
      <h2>Favoritos</h2>
      <div class="panel"><div class="cuadricula"></div></div>
    </section>

    <section id="frecuentes" hidden>
      <h2>Visitados con frecuencia</h2>
      <div class="filas"></div>
    </section>

    <section id="privacidad">
      <h2>Informe de privacidad</h2>
      <a class="destacada" href="about:protections">
        <span class="escudo"></span>
        <span class="cifra" id="rastreadores">0</span>
        <span class="texto" id="rastreadores-texto">En los últimos siete días, Fyx evitó que los rastreadores te siguieran.</span>
        <span class="mas">Ver informe</span>
      </a>
    </section>

    <section id="reanudar" hidden>
      <h2>Reanudar navegación</h2>
      <div class="grupo" id="cerradas" hidden>
        <h3>Cerradas recientemente</h3>
        <div class="filas"></div>
      </div>
      <div id="dispositivos" hidden></div>
    </section>

    <section id="lectura" hidden>
      <h2>Lista de lectura</h2>
      <div class="filas"></div>
    </section>

    <p id="vacio" hidden>Aquí aparecerán tus favoritos, los sitios que más visitas y tu lista de lectura.</p>
  </main>
</body>
</html>
