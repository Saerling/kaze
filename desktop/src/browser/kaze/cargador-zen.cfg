// Fyx — cargador (autoconfig). La primera línea debe ser un comentario.
// Fyx para Windows es Zen con otra marca: este cargador añade el estilo, el actualizador
// y el regulador de memoria de Fyx.
try {
  if (Services.appinfo.name != "Fyx") throw new Error("[Fyx] no es Fyx: no se carga");
  const dir = Cc["@mozilla.org/file/local;1"].createInstance(Ci.nsIFile);
  dir.initWithFile(Services.dirsvc.get("GreD", Ci.nsIFile));
  dir.append("kaze");
  const manifest = dir.clone();
  manifest.append("kaze.manifest");
  Components.manager.QueryInterface(Ci.nsIComponentRegistrar).autoRegister(manifest);
  Services.obs.addObserver(win => {
    if (win.location.href != "chrome://browser/content/browser.xhtml") return;
    win.windowUtils.loadSheetUsingURIString("chrome://kaze/content/pyx.css", win.windowUtils.AUTHOR_SHEET);
    Services.scriptloader.loadSubScript("chrome://kaze/content/actualizador.js", win);
    Services.scriptloader.loadSubScript("chrome://kaze/content/memoria.js", win);
    Services.scriptloader.loadSubScript("chrome://kaze/content/pestanas.js", win);
    Services.scriptloader.loadSubScript("chrome://kaze/content/tinte.js", win);
  }, "browser-delayed-startup-finished");
} catch (e) {
  if (!String(e).includes("no es Fyx")) Cu.reportError(e);
}
