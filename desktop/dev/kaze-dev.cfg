// Kaze — cargador de desarrollo (autoconfig de Firefox). La primera línea debe ser un comentario.
// Carga la interfaz de Kaze desde la carpeta del repo en un Firefox normal, sin compilar.
// Lo instala desktop/dev/instalar.py, que escribe aquí la ruta real de la carpeta de Kaze.
try {
  const file = Cc["@mozilla.org/file/local;1"].createInstance(Ci.nsIFile);
  file.initWithPath("@KAZE_DIR@");
  // loadSubScript no acepta file://: se expone la carpeta como resource://kaze/
  Services.io.getProtocolHandler("resource").QueryInterface(Ci.nsIResProtocolHandler)
    .setSubstitution("kaze", Services.io.newFileURI(file));
  const dir = "resource://kaze/";
  const inject = win => {
    if (win.location.href != "chrome://browser/content/browser.xhtml") return;
    win.windowUtils.loadSheetUsingURIString(dir + "content/kaze.css", win.windowUtils.AUTHOR_SHEET);
    Services.scriptloader.loadSubScript(dir + "content/kaze.js", win);
  };
  Services.obs.addObserver(win => inject(win), "browser-delayed-startup-finished");
} catch (e) {
  Cu.reportError(e);
}
